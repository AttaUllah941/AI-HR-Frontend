<div class="empty-state" role="status">
  <span class="empty-state__badge" aria-hidden="true">
    <mat-icon>{{ icon() }}</mat-icon>
  </span>
  <h2>{{ title() }}</h2>
  @if (message()) {
    <p>{{ message() }}</p>
  }
  <div class="empty-state__actions">
    @if (actionLabel()) {
      <button mat-flat-button color="primary" type="button" (click)="action.emit()">
        @if (actionIcon()) {
          <mat-icon aria-hidden="true">{{ actionIcon() }}</mat-icon>
        }
        {{ actionLabel() }}
      </button>
    }
    <ng-content />
  </div>
</div>
