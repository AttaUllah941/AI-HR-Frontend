<h2 mat-dialog-title>Upload file</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="files-form" (ngSubmit)="submit()">
    <label class="files-dropzone files-form__full">
      <mat-icon aria-hidden="true">upload_file</mat-icon>
      <span>{{ selectedFile()?.name || 'Choose a file (PDF, Office, images, CSV, TXT)' }}</span>
      <input type="file" hidden (change)="onFilePicked($event)" />
    </label>

    <div class="files-form__grid">
      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          @for (cat of categories; track cat) {
            <mat-option [value]="cat">{{ cat }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Title (optional)</mat-label>
        <input matInput formControlName="title" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="files-form__full">
        <mat-label>Description</mat-label>
        <textarea matInput rows="2" formControlName="description"></textarea>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Employee ID</mat-label>
        <input matInput formControlName="employeeId" placeholder="Required for documents" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Candidate ID</mat-label>
        <input matInput formControlName="candidateId" placeholder="Required for resumes" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="saving() || !selectedFile()"
    (click)="submit()"
  >
    @if (saving()) {
      <mat-spinner diameter="16" />
    } @else {
      <mat-icon aria-hidden="true">cloud_upload</mat-icon>
    }
    {{ saving() ? 'Uploading…' : 'Upload' }}
  </button>
</mat-dialog-actions>
