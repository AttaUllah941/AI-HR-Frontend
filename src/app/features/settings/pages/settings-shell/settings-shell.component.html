<app-breadcrumb [items]="breadcrumbItems()" />

<app-page-header
  title="Settings"
  subtitle="Company profile, users, roles, email, storage, and system configuration"
/>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="settings-tabs" aria-label="Settings sections">
  @for (tab of tabs; track tab.route) {
    <a
      mat-tab-link
      [routerLink]="tab.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel class="settings-tabs__panel">
  <router-outlet />
</mat-tab-nav-panel>
