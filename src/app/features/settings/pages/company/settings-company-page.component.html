<app-organization-status
  [loading]="loading()"
  [error]="error()"
  loadingMessage="Loading company…"
  errorTitle="Company unavailable"
  (retry)="reload()"
>
  <section class="settings-page" aria-label="Company profile">
    <div class="settings-action-bar">
      <div>
        <h2 class="settings-page-heading">Company profile</h2>
        <p class="settings-page-sub">Legal identity, contact details, and locale defaults.</p>
      </div>
      @if (canUpdate) {
        <div class="settings-action-bar__actions">
          <button
            mat-flat-button
            color="primary"
            type="button"
            class="settings-add-btn"
            [disabled]="form.invalid || saving()"
            (click)="save()"
          >
            @if (saving()) {
              <mat-spinner diameter="16" />
            } @else {
              <mat-icon aria-hidden="true">save</mat-icon>
            }
            {{ saving() ? 'Saving…' : 'Save company' }}
          </button>
        </div>
      }
    </div>

    <div class="settings-panel-card">
      <form [formGroup]="form" class="settings-form" (ngSubmit)="save()">
        <div class="settings-form__grid">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Legal name</mat-label>
            <input matInput formControlName="legalName" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input matInput formControlName="phone" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Website</mat-label>
            <input matInput formControlName="website" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Logo URL</mat-label>
            <input matInput formControlName="logoUrl" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Timezone</mat-label>
            <input matInput formControlName="timezone" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Locale</mat-label>
            <input matInput formControlName="locale" />
          </mat-form-field>
          <div class="settings-form__full">
            <mat-checkbox formControlName="isActive">Company is active</mat-checkbox>
          </div>
        </div>
      </form>
    </div>
  </section>
</app-organization-status>
