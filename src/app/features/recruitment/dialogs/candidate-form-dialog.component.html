<h2 mat-dialog-title class="recruitment-dialog-title">
  <mat-icon aria-hidden="true">person_search</mat-icon>
  {{ data.candidate ? 'Edit candidate' : 'Add candidate' }}
</h2>

<mat-dialog-content>
  <p class="recruitment-dialog-subtitle">Capture contact details and current role information.</p>

  <form [formGroup]="form" class="recruitment-form" id="candidate-form" (ngSubmit)="submit()">
    <div class="recruitment-form__grid">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="recruitment-form__full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Source</mat-label>
        <input matInput formControlName="source" placeholder="Referral, LinkedIn…" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Current title</mat-label>
        <input matInput formControlName="currentTitle" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Current company</mat-label>
        <input matInput formControlName="currentCompany" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Years experience</mat-label>
        <input matInput type="number" min="0" formControlName="yearsExperience" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="recruitment-form__full">
        <mat-label>LinkedIn URL</mat-label>
        <input matInput formControlName="linkedinUrl" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="recruitment-form__full">
        <mat-label>Portfolio URL</mat-label>
        <input matInput formControlName="portfolioUrl" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="recruitment-form__full">
        <mat-label>Notes</mat-label>
        <textarea matInput rows="3" formControlName="notes"></textarea>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="recruitment-dialog-actions">
  <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    form="candidate-form"
    [disabled]="form.invalid || saving()"
  >
    @if (saving()) {
      <mat-spinner class="save-spinner" diameter="16" />
    }
    {{ saving() ? 'Saving…' : data.candidate ? 'Save changes' : 'Add candidate' }}
  </button>
</mat-dialog-actions>
