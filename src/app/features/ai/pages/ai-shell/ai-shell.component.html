<app-breadcrumb [items]="breadcrumbItems()" />

<app-page-header
  title="Nova"
  subtitle="AI assistant for screening, appraisals, policies, and workforce insights"
/>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="ai-tabs" aria-label="AI sections">
  @for (tab of tabs; track tab.route) {
    <a
      mat-tab-link
      [routerLink]="tab.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel class="ai-tabs__panel">
  <router-outlet />
</mat-tab-nav-panel>
