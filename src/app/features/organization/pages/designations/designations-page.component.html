<app-organization-section-header
  title="Designations"
  description="Define job titles and seniority levels across your organization."
  icon="badge"
  [count]="loading() || error() ? null : items().length"
>
  @if (canCreate) {
    <button mat-flat-button color="primary" type="button" (click)="openForm()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Add designation
    </button>
  }
</app-organization-section-header>

<app-organization-status
  [loading]="loading()"
  [error]="error()"
  loadingMessage="Loading designations…"
  errorTitle="Designations unavailable"
  (retry)="reload()"
>
  @if (items().length === 0) {
    <app-empty-state
      title="No designations yet"
      message="Add designations to represent roles and seniority levels in your company."
      icon="badge"
    >
      @if (canCreate) {
        <button mat-flat-button color="primary" type="button" (click)="openForm()">
          <mat-icon aria-hidden="true">add</mat-icon>
          Add designation
        </button>
      }
    </app-empty-state>
  } @else {
    <div class="org-entity-list" role="list" aria-label="Designations">
      @for (item of items(); track item.id) {
        <mat-card class="org-entity-card" role="listitem">
          <div class="org-entity-card__body">
            <div class="org-entity-card__title">
              <strong>{{ item.name }}</strong>
              <code class="org-entity-card__code">{{ item.code }}</code>
              <span class="org-entity-card__badge">Level {{ item.level }}</span>
            </div>
            @if (item.description) {
              <p class="org-entity-card__meta">{{ item.description }}</p>
            }
          </div>
          <div class="org-entity-card__actions">
            @if (canUpdate) {
              <button
                mat-icon-button
                type="button"
                aria-label="Edit {{ item.name }}"
                [disabled]="deletingId() === item.id"
                (click)="openForm(item)"
              >
                <mat-icon>edit</mat-icon>
              </button>
            }
            @if (canDelete) {
              <button
                mat-icon-button
                type="button"
                aria-label="Delete {{ item.name }}"
                [disabled]="deletingId() === item.id"
                (click)="remove(item)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            }
          </div>
        </mat-card>
      }
    </div>
  }
</app-organization-status>
