<app-breadcrumb [items]="breadcrumbItems()" />

<app-page-header
  title="Organization"
  subtitle="Manage company structure — branches, departments, teams, and designations"
/>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="org-tabs" aria-label="Organization sections">
  @for (tab of tabs; track tab.route) {
    <a
      mat-tab-link
      [routerLink]="tab.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel class="org-tabs__panel">
  <router-outlet />
</mat-tab-nav-panel>
