<app-organization-section-header
  title="Teams"
  description="Create and manage teams within departments."
  icon="groups"
  [count]="loading() || error() ? null : items().length"
>
  @if (canCreate) {
    <button mat-flat-button color="primary" type="button" (click)="openForm()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Add team
    </button>
  }
</app-organization-section-header>

<app-organization-status
  [loading]="loading()"
  [error]="error()"
  loadingMessage="Loading teams…"
  errorTitle="Teams unavailable"
  (retry)="reload()"
>
  @if (items().length === 0) {
    <app-empty-state
      title="No teams yet"
      message="Teams help you group employees within departments."
      icon="groups"
    >
      @if (canCreate) {
        <button mat-flat-button color="primary" type="button" (click)="openForm()">
          <mat-icon aria-hidden="true">add</mat-icon>
          Add team
        </button>
      }
    </app-empty-state>
  } @else {
    <div class="org-entity-list" role="list" aria-label="Teams">
      @for (item of items(); track item.id) {
        <mat-card class="org-entity-card" role="listitem">
          <div class="org-entity-card__body">
            <div class="org-entity-card__title">
              <strong>{{ item.name }}</strong>
              <code class="org-entity-card__code">{{ item.code }}</code>
            </div>
            <p class="org-entity-card__meta">
              <mat-icon aria-hidden="true">account_tree</mat-icon>
              {{ item.department?.name || '—' }}
            </p>
          </div>
          <div class="org-entity-card__actions">
            @if (canUpdate) {
              <button
                mat-icon-button
                type="button"
                aria-label="Edit {{ item.name }}"
                [disabled]="deletingId() === item.id"
                (click)="openForm(item)"
              >
                <mat-icon>edit</mat-icon>
              </button>
            }
            @if (canDelete) {
              <button
                mat-icon-button
                type="button"
                aria-label="Delete {{ item.name }}"
                [disabled]="deletingId() === item.id"
                (click)="remove(item)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            }
          </div>
        </mat-card>
      }
    </div>
  }
</app-organization-status>
