<h2 mat-dialog-title class="performance-dialog-title">
  <mat-icon aria-hidden="true">forum</mat-icon>
  Give feedback
</h2>

<mat-dialog-content>
  <p class="performance-dialog-subtitle">Share constructive feedback with a colleague.</p>

  <form [formGroup]="form" class="performance-form" id="feedback-form" (ngSubmit)="submit()">
    <div class="performance-form__grid">
      <mat-form-field appearance="outline" class="performance-form__full">
        <mat-label>To</mat-label>
        <mat-select formControlName="toEmployeeId">
          @for (emp of employees(); track emp.id) {
            <mat-option [value]="emp.id">{{ employeeLabel(emp) }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          @for (t of types; track t) {
            <mat-option [value]="t">{{ typeLabel(t) }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Rating</mat-label>
        <input matInput type="number" min="0" max="5" step="0.1" formControlName="rating" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="performance-form__full">
        <mat-label>Content</mat-label>
        <textarea matInput rows="4" formControlName="content"></textarea>
      </mat-form-field>

      <mat-checkbox formControlName="isAnonymous" class="performance-form__full">
        Submit anonymously
      </mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="performance-dialog-actions">
  <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    form="feedback-form"
    [disabled]="form.invalid || saving()"
  >
    @if (saving()) {
      <mat-spinner class="save-spinner" diameter="16" />
    }
    {{ saving() ? 'Submitting…' : 'Submit feedback' }}
  </button>
</mat-dialog-actions>
