<h2 mat-dialog-title class="performance-dialog-title">
  <mat-icon aria-hidden="true">speed</mat-icon>
  {{ data.kpi ? 'Edit KPI' : 'Create KPI' }}
</h2>

<mat-dialog-content>
  <p class="performance-dialog-subtitle">Define a reusable KPI for employee assignments.</p>

  <form [formGroup]="form" class="performance-form" id="kpi-form" (ngSubmit)="submit()">
    <div class="performance-form__grid">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="performance-form__full">
        <mat-label>Description</mat-label>
        <textarea matInput rows="2" formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unit</mat-label>
        <input matInput formControlName="unit" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Default target</mat-label>
        <input matInput type="number" formControlName="targetDefault" />
      </mat-form-field>

      <mat-checkbox formControlName="isActive" class="performance-form__full">Active</mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="performance-dialog-actions">
  <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    form="kpi-form"
    [disabled]="form.invalid || saving()"
  >
    @if (saving()) {
      <mat-spinner class="save-spinner" diameter="16" />
    }
    {{ saving() ? 'Saving…' : data.kpi ? 'Save changes' : 'Create KPI' }}
  </button>
</mat-dialog-actions>
