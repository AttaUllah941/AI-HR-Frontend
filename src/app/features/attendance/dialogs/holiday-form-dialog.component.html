<h2 mat-dialog-title class="att-dialog-title">
  <mat-icon aria-hidden="true">event</mat-icon>
  {{ data.holiday ? 'Edit holiday' : 'Add holiday' }}
</h2>

<mat-dialog-content>
  <p class="att-dialog-subtitle">
    {{ data.holiday ? 'Update holiday details.' : 'Add a company holiday for the calendar year.' }}
  </p>

  <form [formGroup]="form" class="att-form" id="holiday-form" (ngSubmit)="submit()">
    <div class="att-form__grid">
      <mat-form-field appearance="outline" class="att-form__full">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        @if (form.controls.name.touched && form.controls.name.hasError('required')) {
          <mat-error>Name is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date</mat-label>
        <input matInput type="date" formControlName="date" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="att-form__full">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>
    </div>

    <mat-checkbox formControlName="isOptional">Optional holiday</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="att-dialog-actions">
  <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    form="holiday-form"
    [disabled]="form.invalid || saving()"
  >
    @if (saving()) {
      <mat-spinner class="save-spinner" diameter="16" />
    }
    {{ saving() ? 'Saving…' : 'Save holiday' }}
  </button>
</mat-dialog-actions>
