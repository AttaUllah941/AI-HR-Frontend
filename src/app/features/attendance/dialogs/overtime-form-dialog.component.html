<h2 mat-dialog-title class="att-dialog-title">
  <mat-icon aria-hidden="true">more_time</mat-icon>
  Request overtime
</h2>

<mat-dialog-content>
  <p class="att-dialog-subtitle">Submit an overtime request for review.</p>

  <form [formGroup]="form" class="att-form" id="overtime-form" (ngSubmit)="submit()">
    <div class="att-form__grid">
      <mat-form-field appearance="outline" class="att-form__full">
        <mat-label>Employee</mat-label>
        <mat-select formControlName="employeeId">
          @for (emp of employees(); track emp.id) {
            <mat-option [value]="emp.id">
              {{ emp.firstName }} {{ emp.lastName }}
            </mat-option>
          }
        </mat-select>
        @if (form.controls.employeeId.touched && form.controls.employeeId.hasError('required')) {
          <mat-error>Employee is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date</mat-label>
        <input matInput type="date" formControlName="date" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Minutes</mat-label>
        <input matInput type="number" formControlName="minutes" min="1" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="att-form__full">
        <mat-label>Reason</mat-label>
        <textarea matInput rows="3" formControlName="reason"></textarea>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="att-dialog-actions">
  <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    form="overtime-form"
    [disabled]="form.invalid || saving()"
  >
    @if (saving()) {
      <mat-spinner class="save-spinner" diameter="16" />
    }
    {{ saving() ? 'Saving…' : 'Submit request' }}
  </button>
</mat-dialog-actions>
