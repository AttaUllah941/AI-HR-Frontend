<app-breadcrumb [items]="breadcrumbItems()" />

<app-page-header
  title="Leave"
  subtitle="Manage leave types, balances, requests, and company policy"
/>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="leave-tabs" aria-label="Leave sections">
  @for (tab of tabs; track tab.route) {
    <a
      mat-tab-link
      [routerLink]="tab.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel class="leave-tabs__panel">
  <router-outlet />
</mat-tab-nav-panel>
