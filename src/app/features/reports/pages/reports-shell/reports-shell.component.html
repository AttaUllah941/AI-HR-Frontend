<app-breadcrumb [items]="breadcrumbItems()" />

<app-page-header
  title="Reports & Analytics"
  subtitle="Workforce KPIs, module breakdowns, and exportable insights"
/>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="reports-tabs" aria-label="Reports sections">
  @for (tab of tabs; track tab.route) {
    <a
      mat-tab-link
      [routerLink]="tab.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel class="reports-tabs__panel">
  <router-outlet />
</mat-tab-nav-panel>
