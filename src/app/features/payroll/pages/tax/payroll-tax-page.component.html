<app-organization-section-header
  title="Tax settings"
  description="Company standard tax rate and personal allowance used when processing runs."
  icon="request_quote"
/>

<app-organization-status
  [loading]="loading()"
  [error]="error()"
  loadingMessage="Loading tax settings…"
  errorTitle="Tax settings unavailable"
  (retry)="reload()"
>
  <mat-card class="payroll-policy-card">
    <form [formGroup]="form" class="payroll-form" (ngSubmit)="save()">
      <div class="payroll-form__grid">
        <mat-form-field appearance="outline">
          <mat-label>Tax year</mat-label>
          <input matInput type="number" formControlName="taxYear" min="2000" max="2100" />
          @if (form.controls.taxYear.touched && form.controls.taxYear.invalid) {
            <mat-error>Enter a valid tax year</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Standard rate (%)</mat-label>
          <input
            matInput
            type="number"
            formControlName="standardRate"
            min="0"
            max="100"
            step="0.01"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="payroll-form__full">
          <mat-label>Personal allowance (annual)</mat-label>
          <input matInput type="number" formControlName="personalAllowance" min="0" step="0.01" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="payroll-form__full">
          <mat-label>Notes</mat-label>
          <textarea matInput rows="3" formControlName="notes"></textarea>
        </mat-form-field>
      </div>

      @if (canUpdate) {
        <div class="payroll-policy-actions">
          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="form.invalid || saving() || form.pristine"
          >
            @if (saving()) {
              <mat-spinner class="save-spinner" diameter="16" />
            }
            {{ saving() ? 'Saving…' : 'Save tax settings' }}
          </button>
        </div>
      }
    </form>
  </mat-card>
</app-organization-status>
