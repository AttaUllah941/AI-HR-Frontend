<app-breadcrumb [items]="breadcrumbItems()" />

<app-page-header
  title="Payroll"
  subtitle="Manage salary structures, payroll runs, payslips, and tax settings"
/>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="payroll-tabs" aria-label="Payroll sections">
  @for (tab of tabs; track tab.route) {
    <a
      mat-tab-link
      [routerLink]="tab.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel class="payroll-tabs__panel">
  <router-outlet />
</mat-tab-nav-panel>
