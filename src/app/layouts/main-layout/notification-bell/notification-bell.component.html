<button
  mat-icon-button
  type="button"
  aria-label="Notifications"
  [matMenuTriggerFor]="notificationMenu"
  [matBadge]="notificationCount() || null"
  matBadgeSize="small"
  matBadgeColor="warn"
  [matBadgeHidden]="!notificationCount()"
>
  <mat-icon>notifications</mat-icon>
</button>
<mat-menu #notificationMenu="matMenu" class="zh-menu" xPosition="before">
  <div class="menu-panel" (click)="$event.stopPropagation()">
    <div class="menu-panel__header">
      <strong>Notifications</strong>
      <div class="menu-panel__header-actions">
        @if (notificationCount() > 0) {
          <button
            mat-button
            type="button"
            class="menu-panel__mark-all"
            (click)="markAllNotificationsRead()"
          >
            Mark all read
          </button>
        }
        <a routerLink="/notifications/inbox">View all</a>
      </div>
    </div>
    @if (notifications().length === 0) {
      <p class="menu-panel__empty">No recent notifications</p>
    } @else {
      <ul class="menu-panel__list">
        @for (item of notifications(); track item.id) {
          <li
            class="menu-panel__item"
            [class.menu-panel__item--unread]="!item.read"
            role="button"
            tabindex="0"
            (click)="onNotificationClick(item)"
            (keydown.enter)="onNotificationClick(item)"
          >
            <strong>{{ item.title }}</strong>
            <span>{{ item.body }}</span>
            <time>{{ item.createdAt | appDate: 'datetime' }}</time>
          </li>
        }
      </ul>
    }
  </div>
</mat-menu>
