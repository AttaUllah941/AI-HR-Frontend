<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="main-layout" [class.main-layout--mobile-open]="mobileOpen()">
  <app-sidebar [open]="mobileOpen()" (closeMenu)="closeMobile()" />

  @if (mobileOpen()) {
    <button type="button" class="sidebar-backdrop" aria-label="Close menu" (click)="closeMobile()"></button>
  }

  <div class="main-layout__content">
    <app-header
      [mobileOpen]="mobileOpen()"
      [pageTitle]="pageTitle()"
      [greeting]="greetingMessage()"
      [companyName]="companyName()"
      (menuToggle)="toggleMobile()"
    />

    <main id="main-content" class="page-content" [class.page-content--dashboard]="!showBreadcrumbs()">
      @if (showBreadcrumbs()) {
        <app-breadcrumb [items]="breadcrumbs()" />
      }
      <router-outlet />
    </main>
  </div>

  <app-bottom-nav (more)="toggleMobile()" />
</div>
